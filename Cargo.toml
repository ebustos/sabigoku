[package]
name = "sabigoku"
version = "0.1.1"
edition = "2024"
# Not edition 2024's 1.85: quantette (via icy_sixel, via ratatui-image) needs 1.90.
rust-version = "1.90"
description = "Terminal anime browser and player, with cover art, a watchlist, and AniList sync."
repository = "https://github.com/vantroy/sabigoku"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["anime", "tui", "terminal", "anilist", "mpv"]
categories = ["command-line-utilities", "multimedia::video"]
# Repo plumbing and one-off capture dumps; everything else in the tree is source
# a consumer can build or read. A published version is permanent (yank hides, it
# does not delete), so this list ships as-is forever.
exclude = ["/.github/", "/.githooks/", "/cliff.toml", "/docs/audit/"]
default-run = "sabigoku"

[features]
# The update-check and self-update env-var overrides (SABIGOKU_UPDATE_URL,
# SABIGOKU_INSTALL_URL) exist only so tests/cli.rs can drive the real binary
# against a local fixture. Off by default: no distributed binary reads them.
# NOT cfg(debug_assertions), because the AUR PKGBUILD runs `cargo test
# --release`, which would strip the seam mid-package-build.
test-seams = []

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
# spike_http (ROD-403): HTTPS POST + typed JSON. rustls avoids a system OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
# ROD-433: external kills must reach the clean-drain quit path; ratatui's
# panic hook cannot restore the terminal on SIGTERM/SIGHUP.
signal-hook = "0.3"
# spike_concurrency (ROD-405) / spike_stream (ROD-406): build JSON bodies by value.
serde_json = "1"
# spike_sqlite (ROD-404): `bundled` compiles sqlite from source into the binary,
# no system libsqlite3 to link or version-match.
rusqlite = { version = "0.32", features = ["bundled"] }
# fetchguard (ROD-436): SSRF checks need the parsed, decoded host; already
# in-tree transitively via reqwest.
url = "2"
# player: uid for the IPC socket name (03 §6.3.1, ROD-437), peer-pid
# sockopts, test fifos (ROD-482); already in the lock via a target-gated
# transitive.
nix = { version = "0.29", features = ["socket", "user", "fs"] }
# spike_stream (ROD-406): the stream-resolution crypto.
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
# spike_cover (ROD-417): TUI stack + cover art. ratatui-image renders Kitty
# graphics or halfblocks. Codec list is deliberately closed (ROD-438 review):
# cover CDNs serve jpeg/png/webp/gif; every extra default codec is reachable
# attack surface via magic-byte sniffing, so do not reopen `image/default`
# (ratatui-image's default features would, hence the explicit list there too).
# Never enable `chafa-dyn` or `chafa-static` (ROD-489): both pkg-config link
# system libchafa + glib at build time, so the release binary stops running on
# a machine that lacks them. They only swap the halfblocks encoder; the Kitty
# path does not use chafa.
# toasts (ROD-439): the 36-col copy budget is display-column and grapheme
# aware (DESIGN 4.7); both crates are already in-tree transitively via ratatui.
unicode-width = "0.2"
unicode-segmentation = "1"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = [
  "crossterm",
] }
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
  "gif",
] }
# log sink (ROD-450): `log` facade at call sites, flexi_logger owns the file
# (timestamps + size rotation). No default features: colors/textfilter serve
# stderr styling and runtime filtering we never do.
log = "0.4"
flexi_logger = { version = "0.31", default-features = false }
