[package]
name = "sabigoku"
version = "0.1.0"
edition = "2024"

[dependencies]
# spike_http (ROD-403): HTTPS POST + typed JSON. rustls avoids a system OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
