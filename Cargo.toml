[package]
name = "sabigoku"
version = "0.1.0"
edition = "2024"
default-run = "sabigoku"

[dependencies]
# spike_http (ROD-403): HTTPS POST + typed JSON. rustls avoids a system OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
# ROD-433: external kills must reach the clean-drain quit path; ratatui's
# panic hook cannot restore the terminal on SIGTERM/SIGHUP.
signal-hook = "0.3"
# spike_concurrency (ROD-405) / spike_stream (ROD-406): build JSON bodies by value.
serde_json = "1"
# spike_sqlite (ROD-404): `bundled` compiles sqlite from source into the binary,
# no system libsqlite3 to link or version-match.
rusqlite = { version = "0.32", features = ["bundled"] }
# fetchguard (ROD-436): SSRF checks need the parsed, decoded host; already
# in-tree transitively via reqwest.
url = "2"
# spike_stream (ROD-406): the stream-resolution crypto.
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
# spike_cover (ROD-417): TUI stack + cover art. ratatui-image renders Kitty
# graphics or halfblocks; `image` brings the codec zoo (and most of the tree).
ratatui = "0.30.2"
ratatui-image = "11.0.6"
image = "0.25.10"
