name: release

on:
  push:
    tags: ["v*"]

# Only the publish job widens to write; everything else reads the checkout.
permissions:
  contents: read

# Every `uses:` below is pinned to a commit SHA, never a tag. A mutable tag
# repointed at hostile code runs inside the build job, where it can corrupt the
# binary before sha256sums.txt is computed over it: the checksum would then
# faithfully attest tampered bytes. The trailing comment is the version;
# dependabot bumps both (.github/dependabot.yml).

# A half-published release is worse than a slow one, so never cancel in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag matches manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag disagreeing with the manifest ships a binary whose --version lies,
      # and ROD-465's update-check compares against that string.
      # Keep the version line bare: this parser does not strip inline comments.
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk -F'=' '
            /^\[package\]/ { inpkg = 1; next }
            /^\[/          { inpkg = 0 }
            inpkg && $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
              gsub(/["[:space:]]/, "", $2); print $2; exit
            }
          ' Cargo.toml)
          if [ -z "$manifest" ]; then
            echo "::error::no version found in Cargo.toml [package]"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      # The release body is the curated CHANGELOG section, never generated from
      # commits. Catch a missing or empty one here, not after the builds.
      - name: changelog has a non-empty section for this version
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          scripts/changelog-section.sh "$v" > /dev/null
          echo "changelog section [${v}] present and non-empty"

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One target failing must not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          # Every target builds and runs on its own architecture. Intel macOS is
          # deliberately absent: macos-13 is retired, so it could only be
          # cross-built, and nothing here could execute what it produced.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            musl: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      # rusqlite is `bundled` and ring carries C and asm, so a musl target
      # needs a musl-targeting C compiler even though rust-std is self-contained.
      - name: install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin sabigoku

      # Rosetta leaves the smoke test below arch-blind: an x86_64 binary would
      # execute on this runner and print the right version. The other two
      # targets need no such check, since a wrong arch simply will not exec.
      - name: verify architecture
        if: runner.os == 'macOS'
        shell: bash
        run: file -b target/${{ matrix.target }}/release/sabigoku | grep '^Mach-O 64-bit.*arm64'

      - name: smoke test the artifact
        shell: bash
        run: |
          got=$(./target/${{ matrix.target }}/release/sabigoku --version)
          want="sabigoku v${{ needs.guard.outputs.version }}"
          if [ "$got" != "$want" ]; then
            echo "::error::--version printed '${got}', expected '${want}'"
            exit 1
          fi
          echo "$got"

      # Flat layout: ROD-463's installer expects the binary at the archive root.
      # LICENSE ships because GPL-3 section 4 requires it accompany a binary.
      - name: package
        shell: bash
        run: |
          name="sabigoku-v${{ needs.guard.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sabigoku" LICENSE README.md dist/
          tar -czf "${name}.tar.gz" -C dist sabigoku LICENSE README.md
          ls -lh "${name}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sabigoku-${{ matrix.target }}
          path: sabigoku-v*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md: the release body is curated text from the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # The same script the guard ran, so a release cannot be published with a
      # body the guard never saw.
      - name: release notes from CHANGELOG
        shell: bash
        run: |
          scripts/changelog-section.sh "${{ needs.guard.outputs.version }}" > notes.md
          echo "----- release notes -----"
          cat notes.md

      # Checksums are computed here, over exactly the bytes that get uploaded,
      # rather than per build job where nothing could compare them.
      - name: checksums
        shell: bash
        working-directory: artifacts
        run: |
          shopt -s nullglob
          set -- sabigoku-v*.tar.gz
          if [ "$#" -ne 3 ]; then
            echo "::error::expected 3 artifacts, found $#: $*"
            exit 1
          fi
          sha256sum sabigoku-v*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      # Publishes live on tag push (ROD-492). There is no human gate left: the
      # version guard, the changelog guard, the smoke tests and the artifact
      # count are the only things between a bad tag and the internet. Weigh that
      # before weakening any of them.
      # A tag carrying a suffix (v0.2.0-rc1) publishes as a prerelease, so it
      # never becomes the release an installer resolves as latest.
      # --verify-tag stops gh from minting a tag off HEAD. On a tags: trigger
      # the tag exists by construction, so it only ever fires on a broken one.
      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          case "${GITHUB_REF_NAME}" in
            *-*) extra+=(--prerelease); echo "suffixed tag, publishing as a prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes-file notes.md \
            --title "sabigoku ${GITHUB_REF_NAME}" \
            "${extra[@]}" \
            artifacts/sabigoku-v*.tar.gz \
            artifacts/sha256sums.txt

  crates-io:
    name: publish to crates.io
    # Last, and only once the GitHub release exists. A crates.io version is
    # permanent (yank hides it, nothing replaces it), so the reversible half of
    # the release goes first: a failure there must not strand a version that
    # can never be reused.
    needs: [guard, publish]
    # A suffixed tag stays on the GitHub prerelease channel. Spending a
    # permanent version on an rc buys nothing an artifact download does not.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Re-running the workflow, or re-cutting a tag, must not fail on a version
      # that already shipped. crates.io refuses a duplicate and offers no way to
      # replace one, so skipping is the only recovery that exists.
      - name: is this version already on crates.io
        id: published
        shell: bash
        run: |
          name=sabigoku
          # Sparse-index layout for a crate name of four or more characters.
          url="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          v="${{ needs.guard.outputs.version }}"
          body=$(mktemp)
          # Only 404 means unpublished. An outage, a 5xx or a rate-limit answers
          # nothing about what is on the registry, and treating that silence as
          # "not published" walks into a publish attempt blind.
          code=$(curl -sS -o "$body" -w '%{http_code}' --retry 3 --retry-all-errors "$url") || code=000
          case "$code" in
            200) ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT"
                 echo "crate ${name} is not on the index yet; this is its first publish"
                 exit 0 ;;
            *)   echo "::error::crates.io index returned ${code} for ${name}; cannot tell whether ${v} is published"
                 exit 1 ;;
          esac
          if grep -q "\"vers\":\"${v}\"" "$body"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${v} is already on crates.io; nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${v} is not on crates.io yet; publishing"
          fi

      # --locked keeps the verify build on the lockfile the rest of CI tested.
      # Never add --no-verify: that build is the only thing proving the packaged
      # tarball compiles on its own, and it is unfixable once uploaded.
      - name: publish
        if: steps.published.outputs.skip == 'false'
        shell: bash
        env:
          # Keep this token scoped to publish-update. The crate name was created
          # by a manual publish-new; a runner that can also yank or transfer
          # ownership is a strictly worse trade for the same capability.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is unset; add it under repo settings -> secrets"
            exit 1
          fi
          cargo publish --locked


  # The AUR half is two jobs on purpose. Building the package runs every crate's
  # build script, proc macros and test binaries; the push holds a key that can
  # write to a package other people install. Nothing that executes third-party
  # code and nothing that holds the key may share a machine.
  aur-build:
    name: build the AUR package
    # The PKGBUILD builds from the tag's source tarball, so the tag must exist
    # and the release must have survived its own guards before Arch users are
    # pointed at it. Independent of crates-io: nothing here reads the registry.
    needs: [guard, publish]
    # A prerelease has no business on the AUR, which has one channel and no
    # concept of a version users should not resolve.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel@sha256:412efebb0eeef0ef322ff24ad73f82b1ba2d3b12377db4c5fbe3074c7e7e8678
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # -Syu, never a bare -Sy: a partial upgrade against a moved mirror is how
      # an Arch container breaks halfway through a build. mpv is installed here
      # because it is a declared depends: with it already present, makepkg needs
      # no -s, so the build user needs no sudo to reach pacman.
      - name: install toolchain
        run: pacman -Syu --noconfirm --needed git rust namcap mpv

      # Unprivileged, and deliberately granted nothing. makepkg refuses to run
      # as root, and the code it runs is every build script in the crate graph.
      - name: create a build user
        run: |
          useradd -m builder
          chown -R builder:builder packaging/aur

      - name: render the PKGBUILD for this tag
        working-directory: packaging/aur
        run: |
          v="${{ needs.guard.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${v}.tar.gz"
          # The tag exists by the time this runs, but codeload's CDN can 404 for
          # a beat right after a release publishes, so ride it out.
          curl -fsSL --connect-timeout 30 --max-time 120 \
            --retry 5 --retry-delay 3 --retry-all-errors "$url" -o src.tar.gz
          # curl -f gates on HTTP status, not on the body: a 200 carrying a CDN
          # interstitial would hash perfectly happily.
          tar tzf src.tar.gz >/dev/null 2>&1 ||
            { echo "::error::downloaded archive is not a valid gzip tarball"; exit 1; }
          sum=$(sha256sum src.tar.gz | awk '{print $1}')

          sed -i "s/^pkgver=.*/pkgver=${v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD
          # Verify the sed instead of trusting it. A no-op leaves the previous
          # release's checksum, which still regenerates a self-consistent
          # .SRCINFO that the AUR accepts, and then fails integrity on every
          # user's makepkg.
          grep -qx "sha256sums=('${sum}')" PKGBUILD ||
            { echo "::error::sha256 bump did not land in PKGBUILD"; exit 1; }

          rm -f src.tar.gz
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          # Anchored, so v0.1.0 cannot be satisfied by a v0.1.01 line.
          grep -qE "^[[:space:]]*pkgver = ${v}$" .SRCINFO ||
            { echo "::error::.SRCINFO did not regenerate to v${v}"; exit 1; }
          cat PKGBUILD

      # Build it before publishing it. An AUR package that does not compile is
      # visible to every Arch user the moment it is pushed, and this recipe is
      # the only thing that ever gets tested.
      - name: build and test the package
        working-directory: packaging/aur
        run: sudo -u builder makepkg -f --noconfirm

      # Errors fail the job; warnings do not. Two warnings are permanent and
      # cannot be silenced: gcc-libs is implicitly satisfied, and mpv is a
      # runtime shell-out namcap cannot see.
      - name: namcap
        working-directory: packaging/aur
        run: |
          namcap PKGBUILD ./*.pkg.tar.zst | tee namcap.log
          # Match E: anywhere in the label, since namcap prefixes a package
          # finding with "sabigoku" and a PKGBUILD finding with "PKGBUILD (sabigoku)".
          if grep -qE '(^|[[:space:]])E: ' namcap.log; then
            echo "::error::namcap reported an error"
            exit 1
          fi

      # Only the two text files cross into the job that holds the key. The built
      # package stays here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-recipe
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          if-no-files-found: error

  aur-publish:
    name: publish to the AUR
    needs: [guard, aur-build]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No cargo, no makepkg, no container: this job runs nothing from the crate
      # graph, so the key is never in reach of third-party code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-recipe
          path: recipe

      - name: publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is unset; add it under repo settings -> secrets"
            exit 1
          fi
          v="${{ needs.guard.outputs.version }}"

          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned host key, never StrictHostKeyChecking=no: this key can write
          # to a package other people install.
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          # An unpublished package name clones as an empty repo; that is the
          # documented AUR submission path, so the first release creates it.
          git clone "ssh://aur@aur.archlinux.org/sabigoku.git" aur-repo
          if [ -f aur-repo/PKGBUILD ] &&
             grep -qx "pkgver=${v}" aur-repo/PKGBUILD &&
             grep -qx "pkgrel=1" aur-repo/PKGBUILD; then
            echo "the AUR already carries ${v}-1; nothing to push"
            exit 0
          fi

          cp recipe/PKGBUILD recipe/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "vantroy"
          git config user.email "vantroy@gmail.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "no change to push"
            exit 0
          fi
          git commit -m "sabigoku ${v}-1"
          git push
