name: release

on:
  push:
    tags: ["v*"]

# Only the publish job widens to write; everything else reads the checkout.
permissions:
  contents: read

# A half-published release is worse than a slow one, so never cancel in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag matches manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # A tag disagreeing with the manifest ships a binary whose --version lies,
      # and ROD-465's update-check compares against that string.
      # Keep the version line bare: this parser does not strip inline comments.
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk -F'=' '
            /^\[package\]/ { inpkg = 1; next }
            /^\[/          { inpkg = 0 }
            inpkg && $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
              gsub(/["[:space:]]/, "", $2); print $2; exit
            }
          ' Cargo.toml)
          if [ -z "$manifest" ]; then
            echo "::error::no version found in Cargo.toml [package]"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

      # The release body is the curated CHANGELOG section, never generated from
      # commits. Catch a missing or empty one here, not after four builds.
      - name: changelog has a non-empty section for this version
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          grep -qE "^## \[${v}\]" CHANGELOG.md \
            || { echo "::error::no '## [${v}]' section in CHANGELOG.md; promote [Unreleased] before tagging"; exit 1; }
          body=$(awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { g = 1; next }
            g && /^## \[/            { exit }
            g && /^\[[^]]+\]:/       { exit }
            g                        { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::section '## [${v}]' in CHANGELOG.md is empty"
            exit 1
          fi
          echo "changelog section [${v}] present and non-empty"

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One target failing must not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            musl: false
            smoke: true
          # Cross-built: macos-13, the last Intel image, is being retired. An
          # arm runner cannot exec x86_64, so this artifact ships unsmoked.
          - target: x86_64-apple-darwin
            runner: macos-latest
            musl: false
            smoke: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rusqlite is `bundled` and ring carries C and asm, so a musl target
      # needs a musl-targeting C compiler even though rust-std is self-contained.
      - name: install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin sabigoku

      - name: smoke test the artifact
        if: matrix.smoke
        shell: bash
        run: |
          got=$(./target/${{ matrix.target }}/release/sabigoku --version)
          want="sabigoku v${{ needs.guard.outputs.version }}"
          if [ "$got" != "$want" ]; then
            echo "::error::--version printed '${got}', expected '${want}'"
            exit 1
          fi
          echo "$got"

      # Flat layout: ROD-463's installer expects the binary at the archive root.
      # LICENSE ships because GPL-3 section 4 requires it accompany a binary.
      - name: package
        shell: bash
        run: |
          name="sabigoku-v${{ needs.guard.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sabigoku" LICENSE README.md dist/
          tar -czf "${name}.tar.gz" -C dist sabigoku LICENSE README.md
          ls -lh "${name}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sabigoku-${{ matrix.target }}
          path: sabigoku-v*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md: the release body is curated text from the repo.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Same extraction the guard validated, so a release cannot be published
      # with a body the guard never saw.
      - name: release notes from CHANGELOG
        shell: bash
        run: |
          awk -v ver="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { g = 1; next }
            g && /^## \[/            { exit }
            g && /^\[[^]]+\]:/       { exit }
            g                        { print }
          ' CHANGELOG.md > notes.md
          echo "----- release notes -----"
          cat notes.md

      # Checksums are computed here, over exactly the bytes that get uploaded,
      # rather than per build job where nothing could compare them.
      - name: checksums
        shell: bash
        working-directory: artifacts
        run: |
          shopt -s nullglob
          set -- sabigoku-v*.tar.gz
          if [ "$#" -ne 4 ]; then
            echo "::error::expected 4 artifacts, found $#: $*"
            exit 1
          fi
          sha256sum sabigoku-v*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      # Publishes live on tag push (ROD-492). There is no human gate left: the
      # version guard, the changelog guard, the smoke tests and the artifact
      # count are the only things between a bad tag and the internet. Weigh that
      # before weakening any of them.
      # A tag carrying a suffix (v0.2.0-rc1) publishes as a prerelease, so it
      # never becomes the release an installer resolves as latest.
      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          case "${GITHUB_REF_NAME}" in
            *-*) extra+=(--prerelease); echo "suffixed tag, publishing as a prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file notes.md \
            --title "sabigoku ${GITHUB_REF_NAME}" \
            "${extra[@]}" \
            artifacts/sabigoku-v*.tar.gz \
            artifacts/sha256sums.txt
