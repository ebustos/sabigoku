name: release

on:
  push:
    tags: ["v*"]

# Only the publish job widens to write; everything else reads the checkout.
permissions:
  contents: read

# A half-published release is worse than a slow one, so never cancel in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag matches manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with the manifest ships a binary whose --version
      # lies, and ROD-465's update-check compares against exactly that string.
      # Fail here, before four artifacts get built against a bad number.
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk -F'=' '
            /^\[package\]/ { inpkg = 1; next }
            /^\[/          { inpkg = 0 }
            inpkg && $1 ~ /^[[:space:]]*version[[:space:]]*$/ {
              gsub(/["[:space:]]/, "", $2); print $2; exit
            }
          ' Cargo.toml)
          if [ -z "$manifest" ]; then
            echo "::error::no version found in Cargo.toml [package]"
            exit 1
          fi
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One target failing must not hide whether the others are healthy.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            musl: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            musl: false
            smoke: true
          # Cross-built on the arm runner because macos-13 (the last Intel
          # image) is on GitHub's deprecation path. An arm runner cannot exec
          # an x86_64 binary, so this is the one artifact that ships unsmoked.
          - target: x86_64-apple-darwin
            runner: macos-latest
            musl: false
            smoke: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # rusqlite is `bundled` and ring carries C and asm, so a musl target
      # needs a musl-targeting C compiler even though rust-std is self-contained.
      - name: install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin sabigoku

      - name: smoke test the artifact
        if: matrix.smoke
        shell: bash
        run: |
          got=$(./target/${{ matrix.target }}/release/sabigoku --version)
          want="sabigoku v${{ needs.guard.outputs.version }}"
          if [ "$got" != "$want" ]; then
            echo "::error::--version printed '${got}', expected '${want}'"
            exit 1
          fi
          echo "$got"

      # Flat layout: extraction drops the binary straight where the installer
      # and the manual instructions expect it. LICENSE rides along because
      # GPL-3 section 4 requires it accompany a conveyed binary.
      - name: package
        shell: bash
        run: |
          name="sabigoku-v${{ needs.guard.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sabigoku" LICENSE README.md dist/
          tar -czf "${name}.tar.gz" -C dist sabigoku LICENSE README.md
          ls -lh "${name}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: sabigoku-${{ matrix.target }}
          path: sabigoku-v*.tar.gz
          if-no-files-found: error

  publish:
    name: draft release
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Checksums are computed here, over exactly the bytes that get uploaded,
      # rather than per build job where nothing could compare them.
      - name: checksums
        shell: bash
        working-directory: artifacts
        run: |
          shopt -s nullglob
          set -- sabigoku-v*.tar.gz
          if [ "$#" -ne 4 ]; then
            echo "::error::expected 4 artifacts, found $#: $*"
            exit 1
          fi
          sha256sum sabigoku-v*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      # Draft while the pipeline is unproven; flip to a published release once
      # a tag has gone through end to end (ROD-487).
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            artifacts/sabigoku-v*.tar.gz \
            artifacts/sha256sums.txt
