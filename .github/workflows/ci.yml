name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: this workflow only reads the checkout. Keeps a future edit
# (or the org default flipping) from silently granting it write scope.
permissions:
  contents: read

# Every `uses:` below is pinned to a commit SHA, never a tag: a tag is mutable
# and can be repointed at new code by whoever controls that action's repo, and
# that code runs here. The trailing comment is the version; dependabot bumps
# both (.github/dependabot.yml).

# One run per ref; a fresh push cancels the superseded run instead of piling up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features test-seams -- -D warnings
      # test-seams gates the update env-var overrides so the `update` CLI tests
      # can drive the real binary against a local fixture; off in every shipped
      # build. No --ignored / --include-ignored here, ever: _live tests hit the network.
      - run: cargo test --features test-seams
      # Assert each live target runs zero tests (all #[ignore]d). Semantic, not a
      # grep of #[ignore]: a commented-out attribute, #[tokio::test], or a rename
      # all fool text counting, but a test that actually runs cannot hide here.
      - name: live tests must stay ignored
        shell: bash
        run: |
          shopt -s nullglob
          targets=(tests/*_live.rs)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::no tests/*_live.rs found; the live-test guard is watching nothing"
            exit 1
          fi
          for f in "${targets[@]}"; do
            name=$(basename "$f" .rs)
            out=$(cargo test --test "$name" 2>&1 || true)
            if ! grep -qE 'test result: ok\. 0 passed; 0 failed' <<<"$out"; then
              echo "::error file=$f::$name ran a live test unignored; every _live test must be #[ignore]d"
              grep 'test result:' <<<"$out" || true
              exit 1
            fi
          done

  macos-build:
    name: build (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build --bin sabigoku

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # install.sh declares #!/bin/sh, so shellcheck holds it to POSIX and
      # rejects the bashisms that would break it on a box where /bin/sh is dash.
      # Preinstalled on the runner image.
      - run: shellcheck install.sh scripts/*.sh
