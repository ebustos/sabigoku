name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-test:
    name: lint + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # ratatui-image (chafa-dyn) pkg-config links system libchafa at build time; runners lack it.
      - name: install libchafa
        run: sudo apt-get update && sudo apt-get install -y libchafa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # No --ignored / --include-ignored here, ever: the _live tests hit the network.
      - run: cargo test
      - name: live tests must stay ignored
        run: |
          for f in tests/*_live.rs; do
            n=$(grep -c '#\[test\]' "$f")
            i=$(grep -c '#\[ignore' "$f")
            if [ "$n" != "$i" ]; then
              echo "::error file=$f::live test file has an un-ignored test ($n tests, $i ignored)"
              exit 1
            fi
          done

  macos-build:
    name: build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install chafa
        run: brew install chafa
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin sabigoku
